name: Daily Weights

on:
  schedule:
    # 13:30 UTC = 15:30 CET / 14:30 GMT — gives 30 min before your 16:00 block
    - cron: "30 13 * * 1-5"  # Mon-Fri only
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  compute-weights:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute daily weights
        env:
          FRED_API_KEY:              ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Production strategies: sector2e (US best) + sector2f (UCITS-tradeable
          # on Nordnet). Set explicitly rather than relying on daily_weights.py's
          # v1,v2,v3 default, which reports the legacy bond strategies.
          DAILY_STRATEGIES:          sector2e,sector2f
        run: python daily_weights.py

      - name: Rotate old positions files
        run: |
          find positions/ -maxdepth 1 -name "????-??-??.xlsx" -mtime +30 -delete
          find positions/ -maxdepth 1 -name "????-??-??_*.csv" -mtime +30 -delete

      - name: Commit positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions/
          git diff --staged --quiet || git commit -m "positions: $(date +%Y-%m-%d)"
          git push

      - name: Resolve today's xlsx path
        id: xlsx
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "path=positions/${TODAY}.xlsx" >> "$GITHUB_OUTPUT"

      - name: Read email content
        id: email
        run: |
          echo "subject=$(cat /tmp/email_subject.txt)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EMAILEOF'
            cat /tmp/email_body.txt
            echo 'EMAILEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: mbmorsund@gmail.com
          from: Bond Trading Bot <${{ secrets.EMAIL_USERNAME }}>
          attachments: ${{ steps.xlsx.outputs.path }}
          body: ${{ steps.email.outputs.body }}
          content_type: text/plain
